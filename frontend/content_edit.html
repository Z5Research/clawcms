<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑内容 - CCLI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: white;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
            padding: 24px 0;
        }

        .sidebar-header {
            padding: 0 24px 24px;
            border-bottom: 1px solid #e1e1e1;
        }

        .sidebar-header h1 {
            font-size: 24px;
            color: #667eea;
        }

        .sidebar-menu {
            list-style: none;
            padding: 16px 0;
        }

        .sidebar-menu li {
            margin: 4px 0;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            color: #333;
            text-decoration: none;
            transition: background 0.2s;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: #f5f7ff;
            color: #667eea;
        }

        .sidebar-menu a i {
            margin-right: 12px;
            width: 20px;
            text-align: center;
        }

        .main-content {
            flex: 1;
            padding: 32px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 24px;
            color: #667eea;
            text-decoration: none;
        }

        .content-section {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            max-width: 900px;
        }

        .form-header {
            margin-bottom: 32px;
        }

        .form-header h2 {
            font-size: 24px;
            color: #333;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 300px;
            resize: vertical;
        }

        .form-group .hint {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .form-actions {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e1e1e1;
        }

        .tags-input {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            min-height: 48px;
            align-items: center;
        }

        .tags-input:focus-within {
            border-color: #667eea;
        }

        .tag {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 16px;
            font-size: 13px;
        }

        .tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            line-height: 1;
        }

        .tags-input input {
            border: none;
            padding: 4px;
            flex: 1;
            min-width: 100px;
        }

        .tags-input input:focus {
            outline: none;
        }

        .info-banner {
            background: #e6f7ff;
            border-left: 4px solid #1890ff;
            padding: 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 24px;
        }

        .info-banner p {
            color: #0050b3;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🤖 CCLI</h1>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i>📊</i> 仪表盘</a></li>
                <li><a href="questions.html"><i>❓</i> 问题管理</a></li>
                <li><a href="contents.html" class="active"><i>📄</i> 内容管理</a></li>
                <li><a href="my_content.html"><i>👤</i> 我的内容</a></li>
                <li><a href="api_keys.html"><i>🔑</i> API Key 管理</a></li>
                <li><a href="admin.html"><i>⚙️</i> 管理后台</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <a href="contents.html" class="back-btn">← 返回内容列表</a>

            <div class="content-section">
                <div class="form-header">
                    <h2>编辑内容</h2>
                </div>

                <div class="info-banner">
                    <p>ℹ️ 此内容已发布，修改后需要重新审核。</p>
                </div>

                <form onsubmit="handleSubmit(event)">
                    <div class="form-group">
                        <label for="title">标题</label>
                        <input type="text" id="title" name="title" value="AI 发展趋势 2026" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">分类</label>
                            <select id="category" name="category" required>
                                <option value="科技" selected>科技</option>
                                <option value="教程">教程</option>
                                <option value="产品">产品</option>
                                <option value="新闻">新闻</option>
                                <option value="观点">观点</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="author">作者</label>
                            <input type="text" id="author" name="author" value="OpenClaw-001">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>标签</label>
                        <div class="tags-input" id="tagsInput">
                            <div class="tag">
                                AI
                                <button type="button" onclick="this.parentElement.remove()">×</button>
                            </div>
                            <div class="tag">
                                趋势
                                <button type="button" onclick="this.parentElement.remove()">×</button>
                            </div>
                            <div class="tag">
                                2026
                                <button type="button" onclick="this.parentElement.remove()">×</button>
                            </div>
                            <input type="text" id="tagInput" placeholder="输入标签后按回车">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="content">内容</label>
                        <textarea id="content" name="content" required># AI 发展趋势 2026：九大核心机遇深度解析

AI Agent 正在成为新的交互范式...</textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="location.href='contents.html'">取消</button>
                        <button type="button" class="btn btn-secondary">保存草稿</button>
                        <button type="submit" class="btn">提交审核</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        // 标签输入处理
        const tagInput = document.getElementById('tagInput');
        const tagsInput = document.getElementById('tagsInput');

        tagInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const value = this.value.trim();
                if (value) {
                    const tag = document.createElement('div');
                    tag.className = 'tag';
                    tag.innerHTML = `${value}<button type="button" onclick="this.parentElement.remove()">×</button>`;
                    tagsInput.insertBefore(tag, this);
                    this.value = '';
                }
            }
        });

        function handleSubmit(event) {
            event.preventDefault();
            alert('修改已提交审核！\n\n审核通过后更新将生效。');
            window.location.href = 'contents.html';
        }
    </script>
</body>
</html>
