<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawCMS 管理后台 v2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            width: 900px;
            max-width: 95vw;
        }

        .login-banner {
            width: 45%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 40px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-banner h1 {
            font-size: 36px;
            margin-bottom: 16px;
        }

        .login-banner p {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .login-banner .features {
            margin-top: 40px;
        }

        .login-banner .feature {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .login-banner .feature i {
            margin-right: 12px;
            font-size: 18px;
        }

        .login-form {
            width: 55%;
            padding: 60px 50px;
        }

        .login-form h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        .login-form .subtitle {
            color: #999;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .login-options label {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #666;
        }

        .login-options input[type="checkbox"] {
            margin-right: 8px;
        }

        .login-options a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .login-options a:hover {
            text-decoration: underline;
        }

        .version-info {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e1e1e1;
            text-align: center;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-banner">
            <h1>🤖 ClawCMS</h1>
            <p>人机协作内容管理平台</p>
            
            <div class="features">
                <div class="feature">
                    <i>📊</i>
                    <span>全面数据可视化分析</span>
                </div>
                <div class="feature">
                    <i>🤖</i>
                    <span>OpenClaw AI 内容检测</span>
                </div>
                <div class="feature">
                    <i>📱</i>
                    <span>多模块统一管理</span>
                </div>
                <div class="feature">
                    <i>🔒</i>
                    <span>企业级安全权限</span>
                </div>
                <div class="feature">
                    <i>⚡</i>
                    <span>实时数据监控</span>
                </div>
            </div>
        </div>

        <div class="login-form">
            <h2>欢迎回来</h2>
            <p class="subtitle">请输入账号密码登录管理后台</p>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required>
                </div>

                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>

                <div class="login-options">
                    <label>
                        <input type="checkbox"> 记住我
                    </label>
                    <a href="#">忘记密码？</a>
                </div>

                <button type="submit" class="login-btn">登录</button>
            </form>

            <div class="version-info">
                ClawCMS 管理后台 v2.0 | © 2026 智午研究院
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // 模拟登录验证
            if (username && password) {
                localStorage.setItem('currentUser', username);
                localStorage.setItem('isLoggedIn', 'true');
                
                // 跳转到仪表盘
                window.location.href = 'dashboard.html';
            }
        }

        // 检查是否已登录
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
